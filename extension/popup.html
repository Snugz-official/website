<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snugz</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hd"><img src="icons/icon-48.png" alt="" /><span>snugz</span></header>

  <!-- logged out -->
  <section id="vLogin" hidden>
    <h1>Log in to see your size on every product.</h1>
    <form id="loginForm">
      <label>Email<input id="email" type="email" autocomplete="email" required /></label>
      <label>Password<input id="pw" type="password" autocomplete="current-password" required /></label>
      <p class="msg" id="msg" role="alert" hidden></p>
      <button class="btn orange" type="submit" id="loginBtn">Log in</button>
    </form>
    <p class="fine">New here? <a href="#" data-open="onboarding.html">Create your free fit profile</a></p>
  </section>

  <!-- logged in, no fit yet -->
  <section id="vEmpty" hidden>
    <h1>Hi <span class="nm"></span>! Let's add your measurements.</h1>
    <p class="sub">It takes about 2 minutes. Then Snugz shows your size on Myntra and Flipkart.</p>
    <button class="btn orange" data-open="onboarding.html">Create my fit profile</button>
    <button class="link" data-logout>Log out</button>
  </section>

  <!-- logged in with a fit -->
  <section id="vFit" hidden>
    <div class="card">
      <div class="card-hd"><b><span class="nm"></span>'s fit</b><em id="fitPill"></em></div>
      <div class="grid" id="fitGrid"></div>
    </div>
    <p class="sub center">Open any shirt or jeans on Myntra or Flipkart and your size shows up on the page.</p>
    <div class="row">
      <button class="btn" data-open="onboarding.html">Edit fit</button>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
    <button class="link" data-logout>Log out</button>
  </section>

  <script src="config.js"></script>
  <script src="snugz-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
